[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hms-qr-product-manager"
version = "0.1.0"
description = "HMS QR Product Manager foundation"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
