services:
  - type: web
    name: hms-qr-product-manager
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn apps.server.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HMS_QR_TEST_ROOT
        value: /tmp/hms-runtime
      - key: HMS_QR_ENV
        value: dev
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
